<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Jersey Artwork</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="max-w-md w-full text-center">
            <div class="mb-8">
                <svg class="mx-auto h-32 w-32 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>

            <h1 class="text-6xl font-bold text-gray-900 mb-4">404</h1>
            <h2 class="text-2xl font-semibold text-gray-700 mb-4">Page Not Found</h2>
            <p class="text-gray-600 mb-8">
                The page you're looking for doesn't exist or has been moved.
            </p>

            <div class="space-y-3">
                <a href="/" class="inline-block bg-blue-600 text-white font-medium px-6 py-3 rounded-lg hover:bg-blue-700 transition">
                    Return to Homepage
                </a>
                <div>
                    <a href="/artworks/" class="text-blue-600 hover:underline">Browse Artworks</a>
                    <span class="mx-2 text-gray-400">•</span>
                    <a href="/contact/" class="text-blue-600 hover:underline">Contact Support</a>
                </div>
            </div>

            <div class="mt-12 text-sm text-gray-500">
                Error Reference: <span class="font-mono">404-{{ request.path|slugify }}</span>
            </div>
        </div>
    </div>
</body>
</html>

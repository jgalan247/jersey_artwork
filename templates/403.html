<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - Jersey Artwork</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="max-w-md w-full text-center">
            <div class="mb-8">
                <svg class="mx-auto h-32 w-32 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>

            <h1 class="text-6xl font-bold text-gray-900 mb-4">403</h1>
            <h2 class="text-2xl font-semibold text-gray-700 mb-4">Access Denied</h2>
            <p class="text-gray-600 mb-8">
                You don't have permission to access this resource. Please log in or contact an administrator if you believe this is an error.
            </p>

            <div class="space-y-3">
                <a href="/accounts/login/" class="inline-block bg-blue-600 text-white font-medium px-6 py-3 rounded-lg hover:bg-blue-700 transition">
                    Log In
                </a>
                <div>
                    <a href="/" class="text-blue-600 hover:underline">Return Home</a>
                    <span class="mx-2 text-gray-400">•</span>
                    <a href="/contact/" class="text-blue-600 hover:underline">Contact Support</a>
                </div>
            </div>

            <div class="mt-12 text-sm text-gray-500">
                <p>If you believe you should have access, please contact support.</p>
            </div>
        </div>
    </div>
</body>
</html>

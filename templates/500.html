<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error - Jersey Artwork</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="max-w-md w-full text-center">
            <div class="mb-8">
                <svg class="mx-auto h-32 w-32 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>

            <h1 class="text-6xl font-bold text-gray-900 mb-4">500</h1>
            <h2 class="text-2xl font-semibold text-gray-700 mb-4">Server Error</h2>
            <p class="text-gray-600 mb-8">
                We're experiencing technical difficulties. Our team has been notified and is working to resolve the issue.
            </p>

            <div class="space-y-3">
                <a href="/" class="inline-block bg-blue-600 text-white font-medium px-6 py-3 rounded-lg hover:bg-blue-700 transition">
                    Return to Homepage
                </a>
                <div>
                    <button onclick="window.location.reload()" class="text-blue-600 hover:underline">
                        Try Again
                    </button>
                    <span class="mx-2 text-gray-400">•</span>
                    <a href="/contact/" class="text-blue-600 hover:underline">Contact Support</a>
                </div>
            </div>

            <div class="mt-12 text-sm text-gray-500">
                <p>If the problem persists, please contact our support team.</p>
            </div>
        </div>
    </div>
</body>
</html>

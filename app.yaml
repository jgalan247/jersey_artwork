# Digital Ocean App Platform Configuration
# Deploy using: doctl apps create --spec app.yaml

name: jersey-artwork
region: lon

services:
  - name: web
    environment_slug: python
    github:
      repo: YOUR_GITHUB_USERNAME/jersey_artwork
      branch: main
      deploy_on_push: true

    # Build configuration
    build_command: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput

    # Run configuration
    run_command: gunicorn --worker-tmp-dir /dev/shm artworks.wsgi:application --workers 4 --bind 0.0.0.0:8080

    # Health check
    health_check:
      http_path: /health/
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    # Instance configuration
    instance_size_slug: professional-xs
    instance_count: 2

    # HTTP port
    http_port: 8080

    # Routes
    routes:
      - path: /

    # Environment variables
    envs:
      - key: DJANGO_SETTINGS_MODULE
        value: artworks.settings_production
        type: SECRET

      - key: SECRET_KEY
        type: SECRET

      - key: ALLOWED_HOSTS
        value: "jersey-artwork.ondigitalocean.app,www.jerseyartwork.com,jerseyartwork.com"
        type: SECRET

      - key: CORS_ALLOWED_ORIGINS
        value: "https://jersey-artwork.ondigitalocean.app,https://www.jerseyartwork.com,https://jerseyartwork.com"
        type: SECRET

      - key: CSRF_TRUSTED_ORIGINS
        value: "https://jersey-artwork.ondigitalocean.app,https://www.jerseyartwork.com,https://jerseyartwork.com"
        type: SECRET

      # Database (will be auto-populated by Digital Ocean)
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}

      # Redis (will be auto-populated by Digital Ocean)
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${redis.REDIS_URL}

      # Spaces configuration
      - key: USE_SPACES
        value: "true"

      - key: SPACES_ACCESS_KEY_ID
        type: SECRET

      - key: SPACES_SECRET_ACCESS_KEY
        type: SECRET

      - key: SPACES_BUCKET_NAME
        value: "jersey-artwork"

      - key: SPACES_REGION
        value: "ams3"

      # Email configuration
      - key: EMAIL_HOST
        value: "smtp.gmail.com"

      - key: EMAIL_PORT
        value: "587"

      - key: EMAIL_HOST_USER
        type: SECRET

      - key: EMAIL_HOST_PASSWORD
        type: SECRET

      - key: DEFAULT_FROM_EMAIL
        value: "Jersey Artwork <noreply@jerseyartwork.com>"

      # Payment gateway configuration
      - key: PAYMENT_PROVIDER
        value: "sumup"

      - key: SUMUP_CLIENT_ID
        type: SECRET

      - key: SUMUP_CLIENT_SECRET
        type: SECRET

      - key: SUMUP_ACCESS_TOKEN
        type: SECRET

      - key: SUMUP_WEBHOOK_SECRET
        type: SECRET

      - key: CITYPAY_MERCHANT_ID
        type: SECRET

      - key: CITYPAY_LICENCE
        type: SECRET

      - key: CITYPAY_WEBHOOK_SECRET
        type: SECRET

      # Subscription configuration
      - key: ARTIST_SUBSCRIPTION_PRICE
        value: "15.00"

      - key: SUBSCRIPTION_CURRENCY
        value: "GBP"

      - key: SUBSCRIPTION_TRIAL_DAYS
        value: "14"

      # Monitoring
      - key: SENTRY_DSN
        type: SECRET

      # reCAPTCHA
      - key: RECAPTCHA_PUBLIC_KEY
        type: SECRET

      - key: RECAPTCHA_SECRET_KEY
        type: SECRET

# Database
databases:
  - name: db
    engine: PG
    version: "15"
    size: db-s-dev-database
    num_nodes: 1

# Redis for caching and sessions
  - name: redis
    engine: REDIS
    version: "7"
    size: db-s-dev-database
    num_nodes: 1

# Worker for background tasks (optional)
workers:
  - name: celery
    environment_slug: python
    github:
      repo: YOUR_GITHUB_USERNAME/jersey_artwork
      branch: main

    build_command: pip install -r requirements.txt
    run_command: celery -A artworks worker -l info --concurrency=2

    instance_size_slug: basic-xxs
    instance_count: 1

    envs:
      - key: DJANGO_SETTINGS_MODULE
        value: artworks.settings_production
        type: SECRET

      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}

      - key: REDIS_URL
        scope: RUN_TIME
        value: ${redis.REDIS_URL}

# Jobs for scheduled tasks
jobs:
  - name: daily-cleanup
    kind: POST_DEPLOY
    github:
      repo: YOUR_GITHUB_USERNAME/jersey_artwork
      branch: main

    run_command: python manage.py cleanup_expired_sessions

    envs:
      - key: DJANGO_SETTINGS_MODULE
        value: artworks.settings_production
        type: SECRET

      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}